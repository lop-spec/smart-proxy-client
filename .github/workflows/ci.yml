name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read native display capability (not UI acceptance)
        timeout-minutes: 1
        shell: pwsh
        run: |
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', ('"' + (Join-Path $PWD 'scripts/read-native-display-capability.ps1') + '"'), '-OutputPath', ('"' + (Join-Path $PWD 'native-display-capability.json') + '"'))
          $probe = Start-Process -FilePath "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -ArgumentList $arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput native-display-capability.log -RedirectStandardError native-display-capability.stderr.log
          if (-not $probe.WaitForExit(45000)) {
            $probe.Kill($true)
            $probe.WaitForExit(5000) | Out-Null
            throw 'Owned capability probe exceeded 45 seconds; no UI acceptance is claimed'
          }
          Get-Content native-display-capability.log, native-display-capability.stderr.log
          if ($probe.ExitCode -ne 0) { throw "Capability collection failed: $($probe.ExitCode)" }
      - name: Retain native display capability
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-display-capability-${{ github.sha }}
          path: |
            native-display-capability.json
            native-display-capability.log
            native-display-capability.stderr.log
          if-no-files-found: error
          retention-days: 7
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build embedded portable EXE
        run: npm run build:portable
      - name: Verify embedded portable EXE
        run: npm run verify:portable
      - name: Retain verified portable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smart-proxy-client-win-x64-${{ github.sha }}
          path: |
            dist/smart-proxy-client/smart-proxy-client-win_x64.exe
            dist/smart-proxy-client/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Native 100 percent UI matrix on an inactive owned desktop
        timeout-minutes: 4
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'native-ui-audit'
          node scripts/prepare-native-ui-audit.cjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture staging failed; no UI acceptance is claimed' }
          $manifest = Get-Content (Join-Path $stage 'manifest.json') -Raw | ConvertFrom-Json
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', ('"' + (Join-Path $PWD 'scripts/run-native-ui-audit.ps1') + '"'), '-Stage', ('"' + $stage + '"'), '-ExpectedExeSha256', $manifest.exeSha256)
          $helper = Start-Process -FilePath "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -ArgumentList $arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput "$stage/output/helper.stdout.log" -RedirectStandardError "$stage/output/helper.stderr.log"
          if (-not $helper.WaitForExit(180000)) {
            $helper.Kill($true)
            $helper.WaitForExit(5000) | Out-Null
            throw 'Owned native helper exceeded 180 seconds; no UI acceptance is claimed'
          }
          Get-Content "$stage/output/helper.stdout.log", "$stage/output/helper.stderr.log"
          if (Test-Path "$stage/output/host.log") { Get-Content "$stage/output/host.log" }
          if ($helper.ExitCode -ne 0) { throw "Native helper failed: $($helper.ExitCode)" }
          node scripts/verify-native-ui.cjs $stage 96
          if ($LASTEXITCODE -ne 0) { throw 'Native DPI/DOM/cleanup gate failed' }
      - name: Read owned native startup failure context
        if: failure()
        timeout-minutes: 1
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'native-ui-audit'
          if (Test-Path "$stage/output/host.json") {
            & ./scripts/collect-native-startup-context.ps1 -Stage $stage
            node scripts/collect-native-error-logs.cjs $stage
            if ($LASTEXITCODE -ne 0) { throw 'Owned native log collection failed' }
          } else {
            Write-Warning 'No owned native host report; startup diagnostics are unavailable, not a passing result'
          }
      - name: Retain native UI output including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-100-${{ github.sha }}
          path: ${{ runner.temp }}/native-ui-audit/output/
          if-no-files-found: warn
          retention-days: 7
