name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build embedded portable EXE
        run: npm run build:portable
      - name: Verify embedded portable EXE
        run: npm run verify:portable
      - name: Retain verified portable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smart-proxy-client-win-x64-${{ github.sha }}
          path: |
            dist/smart-proxy-client/smart-proxy-client-win_x64.exe
            dist/smart-proxy-client/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
