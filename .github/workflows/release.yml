name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build embedded portable EXE
        run: npm run build:portable
      - name: Verify embedded portable EXE
        run: npm run verify:portable
      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/smart-proxy-client/smart-proxy-client-win_x64.exe
          dist/smart-proxy-client/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "Smart Proxy ${{ github.ref_name }}"
